/* ══════════════════════════════════════════════════════════
   JournalTab
══════════════════════════════════════════════════════════ */
function JournalTab({dlabel,journal,color,onSave}) {
  const [mEdit,setMEdit]=React.useState(false);
  const [eEdit,setEEdit]=React.useState(false);
  const [mText,setMText]=React.useState('');
  const [eText,setEText]=React.useState('');
  const [jcardData, setJcardData] = React.useState(null);
  React.useEffect(()=>setMText(journal.morning||''),[journal.morning]);
  React.useEffect(()=>setEText(journal.evening||''),[journal.evening]);

  const VIEW={whiteSpace:'pre-wrap',fontSize:'.9rem',color:'#444',lineHeight:1.8,minHeight:'5rem',cursor:'text',paddingBottom:'.25rem'};
  const TA  ={width:'100%',border:'1px solid #eee',padding:'.5rem',borderRadius:'.4rem',resize:'vertical',fontFamily:'inherit',fontSize:'.9rem',lineHeight:1.8,background:'#fafafa'};

  function save(f,t,se){ onSave(f,t.trim()); se(false); }

  async function exportSection(label, text) {
    setJcardData({label, text});
    await new Promise(r => setTimeout(r, 180));
    const el = document.getElementById('jcard');
    if (!el) { setJcardData(null); return; }
    const cv = await html2canvas(el, {scale:2, useCORS:true});
    setJcardData(null);
    cv.toBlob(async blob => {
      if (!blob) return;
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        alert('클립보드에 복사했어.');
      } catch {
        const u=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=u; a.download=`journal-${new Date().toLocaleDateString('sv-SE')}.png`; a.click(); URL.revokeObjectURL(u);
      }
    });
  }

  return (
    <div style={CARD}>
      <h2 style={{fontSize:'1rem',fontWeight:'bold',marginBottom:'1.5rem',color:'#222'}}>{dlabel}</h2>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.5rem'}}>
        <span style={{fontSize:'.6rem',letterSpacing:'.2em',color:color+'99',display:'block'}}>ᴍᴏʀɴɪɴɢ</span>
        {mText.trim() && <button onClick={()=>exportSection('ᴍᴏʀɴɪɴɢ', mText)} className="icon-btn" style={{fontSize:'.62rem',color:color+'88'}}>↗ export</button>}
      </div>
      {(!mEdit&&mText.trim()) ? (
        <div style={VIEW} onDoubleClick={()=>setMEdit(true)} onContextMenu={e=>{e.preventDefault();setMEdit(true);}}>{mText}</div>
      ):(
        <textarea autoFocus={mEdit} value={mText} onChange={e=>setMText(e.target.value)} onFocus={()=>setMEdit(true)}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();save('morning',mText,setMEdit);}}}
          placeholder="오늘 아침의 생각을 자유롭게. (Enter 저장, Shift+Enter 줄바꿈)" rows={5} style={TA}/>
      )}

      <div style={{borderTop:`1px solid ${color}20`,margin:'1.25rem 0'}}/>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.5rem'}}>
        <span style={{fontSize:'.6rem',letterSpacing:'.2em',color:color+'99',display:'block'}}>ᴇᴠᴇɴɪɴɢ · ɢʀᴀᴛɪᴛᴜᴅᴇ</span>
        {eText.trim() && <button onClick={()=>exportSection('ᴇᴠᴇɴɪɴɢ · ɢʀᴀᴛɪᴛᴜᴅᴇ', eText)} className="icon-btn" style={{fontSize:'.62rem',color:color+'88'}}>↗ export</button>}
      </div>
      {(!eEdit&&eText.trim()) ? (
        <div style={VIEW} onDoubleClick={()=>setEEdit(true)} onContextMenu={e=>{e.preventDefault();setEEdit(true);}}>{eText}</div>
      ):(
        <textarea autoFocus={eEdit} value={eText} onChange={e=>setEText(e.target.value)} onFocus={()=>setEEdit(true)}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();save('evening',eText,setEEdit);}}}
          placeholder="오늘 감사했던 것들을 적어봐. (Enter 저장, Shift+Enter 줄바꿈)" rows={5} style={TA}/>
      )}

      <div style={{borderTop:`1px solid ${color}20`,margin:'1.25rem 0'}}/>

      <span style={{fontSize:'.6rem',letterSpacing:'.2em',color:color+'99',display:'block',marginBottom:'.5rem'}}>ᴍᴏᴏᴅ</span>
      <div style={{display:'flex',gap:'.65rem'}}>
        {MOODS.map(({e,l})=>(
          <button key={l} onClick={()=>onSave('mood',journal.mood===l?null:l)} title={l} style={{
            fontSize:'1.4rem',background:'none',border:'none',cursor:'pointer',padding:0,
            opacity:(!journal.mood||journal.mood===l)?1:0.18,
            transform:journal.mood===l?'scale(1.3)':'scale(1)',
            transition:'all .15s ease',
          }}>{e}</button>
        ))}
      </div>
      {jcardData && <JCard dlabel={dlabel} color={color} label={jcardData.label} text={jcardData.text}/>}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   WeekTab
══════════════════════════════════════════════════════════ */
function WeekTab({dColors,accent}) {
  const [data,setData]=React.useState(null);

  React.useEffect(()=>{
    const today=new Date(), dow=today.getDay();
    const mon=new Date(today); mon.setDate(today.getDate()+(dow===0?-6:1-dow));
    const days=Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
    Promise.all(days.map(async d=>{
      const k=d.toLocaleDateString('sv-SE');
      const [t,j,n]=await Promise.all([
        db.ref('todos/'+k).once('value'),
        db.ref('journal/'+k).once('value'),
        db.ref('notes/'+k).once('value'),
      ]);
      const todos=t.val()||[];
      return {date:d,key:k,todos,journal:j.val()||{},note:n.val()||'',total:todos.length,done:todos.filter(it=>it.state===1).length};
    })).then(setData);
  },[]);

  if (!data) return <div style={{...CARD,textAlign:'center',padding:'3rem',color:'#ccc',fontSize:'.85rem'}}>Loading...</div>;

  const todayKey=new Date().toLocaleDateString('sv-SE');
  const tDone=data.reduce((s,d)=>s+d.done,0);
  const tItems=data.reduce((s,d)=>s+d.total,0);
  const pct=tItems?Math.round(tDone/tItems*100):0;
  const catStats=CATS.map(cat=>{ const ci=data.flatMap(d=>d.todos.filter(t=>t.category===cat)); return {cat,total:ci.length,done:ci.filter(t=>t.state===1).length}; });

  return (
    <div style={CARD}>
      {/* summary */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:'1.25rem'}}>
        <div>
          <span style={sectionLabel({marginBottom:'.2rem'})}>ᴡᴇᴇᴋʟʏ ʀᴇᴠɪᴇᴡ</span>
          <div style={{fontSize:'.78rem',color:'#bbb'}}>{tDone} / {tItems} completed</div>
        </div>
        <div style={{fontSize:'2.4rem',fontWeight:'bold',color:accent,lineHeight:1}}>
          {pct}<span style={{fontSize:'1rem',color:'#ccc'}}>%</span>
        </div>
      </div>

      {/* category bars */}
      <div style={{display:'flex',gap:'.4rem',marginBottom:'1.35rem'}}>
        {catStats.map(({cat,total,done})=>{
          const c=CAT_HUE[cat]||accent, p=total?Math.round(done/total*100):0;
          return (
            <div key={cat} style={{flex:1,background:'#f8f8f8',borderRadius:'.5rem',padding:'.7rem .5rem',textAlign:'center'}}>
              <div style={{fontSize:'.58rem',color:'#bbb',marginBottom:'.25rem',lineHeight:1.4}}>{cat}</div>
              <div style={{fontSize:'1.05rem',fontWeight:'bold',color:c,marginBottom:'.3rem'}}>{p}%</div>
              <div style={{height:'2px',background:'#ebebeb',borderRadius:'9999px',overflow:'hidden'}}>
                <div style={{height:'100%',width:`${p}%`,background:c,borderRadius:'9999px'}}/>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{borderTop:'1px solid #f0f0f0',marginBottom:'1rem'}}/>

      {/* day rows */}
      {data.map(({date,key,total,done,journal,note})=>{
        const c=dColors[key]||accent, ratio=total?done/total:0;
        const isToday=key===todayKey, isFut=key>todayKey;
        const mood=MOODS.find(m=>m.l===journal.mood);
        return (
          <div key={key} style={{
            padding:'.5rem .65rem',borderRadius:'.4rem',marginBottom:'.3rem',
            border:`1.5px solid ${isToday?c:'transparent'}`,
            background:isToday?`${c}07`:'transparent',
            opacity:isFut?0.32:1,
          }}>
            <div style={{display:'flex',alignItems:'center',gap:'.55rem'}}>
              <div style={{minWidth:'4.2rem',display:'flex',gap:'.3rem',alignItems:'baseline'}}>
                <span style={{fontSize:'.67rem',color:'#bbb'}}>{date.toLocaleString('en-US',{weekday:'short'})}</span>
                <span style={{fontSize:'.88rem',fontWeight:isToday?'bold':'500',color:isToday?c:'#333'}}>{date.getDate()}</span>
              </div>
              <div style={{flex:1}}>
                <div style={{height:'2.5px',background:'#f0f0f0',borderRadius:'9999px',overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${ratio*100}%`,background:c,borderRadius:'9999px',transition:'width .5s'}}/>
                </div>
              </div>
              <span style={{fontSize:'.7rem',color:'#bbb',minWidth:'2rem',textAlign:'right'}}>{total?`${done}/${total}`:'—'}</span>
              <span style={{fontSize:'.95rem',opacity:mood?1:0.12}}>{mood?mood.e:'·'}</span>
            </div>
            {note&&!isFut&&(
              <div style={{fontSize:'.7rem',color:'#bbb',marginTop:'.22rem',paddingLeft:'4.9rem',fontStyle:'italic',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                "{note}"
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   RoutineModal
══════════════════════════════════════════════════════════ */
function RoutineModal({routines,onClose}) {
  const [text,setText]=React.useState('');
  const [cat,setCat]=React.useState(CATS[0]);
  const [freq,setFreq]=React.useState('daily');
  const [wds,setWds]=React.useState([1]); /* multi-day: array of 0-6 */

  function toggleWd(d) {
    setWds(prev=>prev.includes(d)?prev.filter(x=>x!==d):[...prev,d].sort((a,b)=>a-b));
  }
  function add() {
    if (!text.trim()) return;
    const r={text:text.trim(),category:cat,freq};
    if (freq==='weekly') r.weekdays=wds.length?wds:[1];
    db.ref('routines').push(r); setText('');
  }
  function rtnLabel(r) {
    if (r.freq==='daily') return '매일';
    /* support both old weekday and new weekdays */
    const days=(r.weekdays||(r.weekday!=null?[r.weekday]:[])).map(d=>WEEK_KO[d]+'요일').join(', ');
    return `매주 ${days}`;
  }

  const inp={border:'1px solid #eee',borderRadius:'.375rem',padding:'.38rem .55rem',fontFamily:'inherit',fontSize:'.82rem',background:'#fff',outline:'none'};

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.22)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}} onClick={onClose}>
      <div style={{...CARD,width:'100%',maxWidth:'350px',maxHeight:'78vh',overflow:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
          <span style={sectionLabel({marginBottom:0})}>ʀᴏᴜᴛɪɴᴇ</span>
          <button onClick={onClose} className="icon-btn" style={{fontSize:'1rem'}}>✕</button>
        </div>

        {routines.length===0&&(
          <div style={{textAlign:'center',color:'#e0e0e0',fontSize:'.85rem',padding:'1rem 0 .5rem'}}>등록된 루틴이 없어.</div>
        )}
        {routines.map(r=>(
          <div key={r.id} style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.45rem .55rem',background:'#f8f8f8',borderRadius:'.4rem',marginBottom:'.3rem'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:'.84rem',color:'#333'}}>{r.text}</div>
              <div style={{fontSize:'.68rem',color:'#bbb',marginTop:'.1rem'}}>{r.category} · {rtnLabel(r)}</div>
            </div>
            <button onClick={()=>db.ref('routines/'+r.id).remove()} className="icon-btn">✕</button>
          </div>
        ))}

        {routines.length>0&&<div style={{borderTop:'1px solid #f0f0f0',margin:'.75rem 0'}}/>}

        <span style={sectionLabel()}>새 루틴 추가</span>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="할 일 내용"
          style={{...inp,width:'100%',marginBottom:'.4rem',display:'block'}}/>
        <div style={{display:'flex',gap:'.4rem',marginBottom:'.4rem'}}>
          <select value={cat} onChange={e=>setCat(e.target.value)} style={{...inp,flex:2}}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select>
          <select value={freq} onChange={e=>setFreq(e.target.value)} style={{...inp,flex:1}}>
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
          </select>
        </div>
        {freq==='weekly'&&(
          <div style={{display:'flex',gap:'4px',flexWrap:'wrap',marginBottom:'.4rem'}}>
            {WEEK_KO.map((l,i)=>(
              <button key={i} onClick={()=>toggleWd(i)} style={{
                padding:'.22rem .55rem',borderRadius:'9999px',border:'1px solid',
                fontSize:'.72rem',cursor:'pointer',fontFamily:'inherit',
                background:wds.includes(i)?'#222':'#fff',
                color:wds.includes(i)?'#fff':'#bbb',
                borderColor:wds.includes(i)?'#222':'#eee',
              }}>{l}</button>
            ))}
          </div>
        )}
        <button onClick={add} style={{...pill('#222','#fff'),width:'100%',padding:'.48rem',borderRadius:'.4rem',display:'block'}}>추가</button>
      </div>
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   WeatherWidget
══════════════════════════════════════════════════════════ */
function WeatherWidget({color}) {
  const ac = color || '#888';
  const [weather, setWeather] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error,   setError]   = React.useState(false);
  const [open,    setOpen]    = React.useState(false);
  const wrapRef = React.useRef(null);

  function wmoEmoji(c) {
    if (c===0)       return '☀️';
    if (c<=2)        return '🌤';
    if (c<=3)        return '☁️';
    if (c<=49)       return '🌫';
    if (c<=67)       return '🌧';
    if (c<=77)       return '❄️';
    if (c<=84)       return '🌧';
    if (c<=99)       return '⛈';
    return '🌡';
  }
  function wmoDesc(c) {
    if (c===0)  return '맑음';
    if (c<=2)   return '구름 조금';
    if (c<=3)   return '흐림';
    if (c<=49)  return '안개';
    if (c<=67)  return '비';
    if (c<=77)  return '눈';
    if (c<=84)  return '소나기';
    if (c<=99)  return '뇌우';
    return '—';
  }

  React.useEffect(()=>{
    if (!navigator.geolocation) { setError(true); setLoading(false); return; }
    navigator.geolocation.getCurrentPosition(async ({coords:{latitude,longitude}})=>{
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
        const d   = await res.json();
        setWeather(d.current_weather);
      } catch { setError(true); }
      setLoading(false);
    }, ()=>{ setError(true); setLoading(false); });
  },[]);

  React.useEffect(()=>{
    if (!open) return;
    function h(e){ if(!wrapRef.current?.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown',h);
    document.addEventListener('touchstart',h,{passive:true});
    return()=>{ document.removeEventListener('mousedown',h); document.removeEventListener('touchstart',h); };
  },[open]);

  const emoji = loading ? '…' : error ? '?' : wmoEmoji(weather?.weathercode??0);
  const temp  = weather ? `${Math.round(weather.temperature)}°` : '';

  return (
    <div ref={wrapRef} style={{position:'fixed',bottom:'116px',left:'20px',zIndex:1000}}>
      <button onClick={()=>setOpen(v=>!v)} style={{
        display:'flex',alignItems:'center',gap:'.35rem',
        background:'#fff',border:'none',borderRadius:'9999px',
        padding:'.38rem .85rem',cursor:'pointer',
        boxShadow:'0 2px 10px rgba(0,0,0,0.10)',fontFamily:'inherit',
      }}>
        <span style={{fontSize:'12px'}}>{emoji}</span>
        <span style={{fontSize:'10px',color:weather?ac:'#ccc',letterSpacing:'.04em',fontVariantNumeric:'tabular-nums'}}>{temp||'날씨'}</span>
      </button>
      {open && weather && (
        <div style={{
          position:'absolute',bottom:'42px',left:0,width:'160px',
          background:'#fff',borderRadius:'12px',
          boxShadow:'0 8px 28px rgba(0,0,0,0.11)',border:'1px solid #f0f0f0',
          padding:'14px 16px 12px',
        }}>
          <div style={{fontSize:'2rem',marginBottom:'6px'}}>{wmoEmoji(weather.weathercode)}</div>
          <div style={{fontSize:'1.5rem',fontWeight:'bold',color:'#333'}}>{Math.round(weather.temperature)}°</div>
          <div style={{fontSize:'.72rem',color:'#999',marginTop:'2px'}}>{wmoDesc(weather.weathercode)}</div>
          <div style={{fontSize:'.65rem',color:'#ccc',marginTop:'3px'}}>풍속 {weather.windspeed} km/h</div>
        </div>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   PomodoroWidget
══════════════════════════════════════════════════════════ */
function PomodoroWidget({color}) {
  const ac = color || '#888';
  const MODE_LABELS = {focus:'집중', short:'쉬기', long:'긴 쉬기'};

  const [open,         setOpen]         = React.useState(false);
  const [showSettings, setShowSettings] = React.useState(false);
  const [mode,         setMode]         = React.useState('focus');
  const [running,      setRunning]      = React.useState(false);
  const [session,      setSession]      = React.useState(0);
  const [durations,    setDurations]    = React.useState(()=>{
    try { const s=JSON.parse(localStorage.getItem('pomoDurations')); if(s?.focus) return s; } catch {}
    return {focus:25,short:5,long:15};
  });
  const [secs, setSecs] = React.useState(()=>{
    try { const s=JSON.parse(localStorage.getItem('pomoDurations')); return (s?.focus||25)*60; } catch {}
    return 25*60;
  });

  const wrapRef    = React.useRef(null);
  const secsRef    = React.useRef(secs);
  const modeRef    = React.useRef('focus');
  const sessionRef = React.useRef(0);
  const dursRef    = React.useRef(durations);
  const tickRef    = React.useRef(null);
  React.useEffect(()=>{ secsRef.current=secs; },      [secs]);
  React.useEffect(()=>{ modeRef.current=mode; },      [mode]);
  React.useEffect(()=>{ sessionRef.current=session; },[session]);
  React.useEffect(()=>{ dursRef.current=durations; }, [durations]);

  /* click-outside to close */
  React.useEffect(()=>{
    if (!open) return;
    function handle(e){ if(!wrapRef.current?.contains(e.target)){ setOpen(false); setShowSettings(false); } }
    document.addEventListener('mousedown',handle);
    document.addEventListener('touchstart',handle,{passive:true});
    return()=>{ document.removeEventListener('mousedown',handle); document.removeEventListener('touchstart',handle); };
  },[open]);

  React.useEffect(()=>{
    if (running) {
      tickRef.current=setInterval(()=>{
        const next=secsRef.current-1;
        if (next<=0) {
          clearInterval(tickRef.current); setRunning(false);
          if (modeRef.current==='focus') {
            const ns=(sessionRef.current+1)%4; setSession(ns);
            if (ns===0){ setSecs(dursRef.current.long*60);  setMode('long'); }
            else       { setSecs(dursRef.current.short*60); setMode('short'); }
          } else { setSecs(dursRef.current.focus*60); setMode('focus'); }
        } else { secsRef.current=next; setSecs(next); }
      },1000);
    } else { clearInterval(tickRef.current); }
    return()=>clearInterval(tickRef.current);
  },[running]);

  function switchMode(m){ setRunning(false); setMode(m); setSecs(durations[m]*60); }
  function reset(){ setRunning(false); setSecs(durations[mode]*60); }
  function adjustDur(m,delta){
    setDurations(d=>{
      const next={...d,[m]:Math.max(5,Math.min(120,d[m]+delta))};
      localStorage.setItem('pomoDurations',JSON.stringify(next));
      if(m===mode){ setRunning(false); setSecs(next[m]*60); }
      return next;
    });
  }

  const mins=Math.floor(secs/60), ss=secs%60;
  const timeStr=`${String(mins).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const circum=2*Math.PI*42;
  const progress=1-secs/(durations[mode]*60);
  const btnRow={display:'flex',alignItems:'center',justifyContent:'center',width:'22px',height:'22px',
    borderRadius:'50%',border:'1px solid #e8e8e8',background:'#f8f8f8',cursor:'pointer',
    fontSize:'13px',color:'#888',fontFamily:'inherit'};

  return (
    <div ref={wrapRef} style={{position:'fixed',bottom:'68px',left:'20px',zIndex:1000}}>
      {/* pill */}
      <button onClick={()=>{setOpen(v=>!v);}} style={{
        display:'flex',alignItems:'center',gap:'.35rem',
        background:'#fff',border:'none',borderRadius:'9999px',
        padding:'.38rem .85rem',cursor:'pointer',
        boxShadow:'0 2px 10px rgba(0,0,0,0.10)',fontFamily:'inherit',
      }}>
        <span style={{fontSize:'11px'}}>🍅</span>
        <span style={{fontSize:'10px',letterSpacing:'.04em',color:running?ac:'#ccc',fontVariantNumeric:'tabular-nums'}}>{timeStr}</span>
      </button>

      {open&&(
        <div style={{
          position:'absolute',bottom:'42px',left:0,width:'210px',
          background:'#fff',borderRadius:'12px',
          boxShadow:'0 8px 28px rgba(0,0,0,0.11)',border:'1px solid #f0f0f0',
          padding:'14px 16px 12px',
        }}>
          {/* gear button */}
          <button onClick={e=>{e.stopPropagation();setShowSettings(s=>!s);}} style={{
            position:'absolute',top:'10px',right:'13px',
            background:'none',border:'none',cursor:'pointer',fontSize:'.65rem',color:'#ccc',padding:0,fontFamily:'inherit',
          }}>⚙ 설정</button>

          {showSettings?(
            /* Settings view */
            <div>
              <div style={{fontWeight:'bold',fontSize:'11px',marginBottom:'.85rem',color:'#555'}}>타이머 설정</div>
              {Object.entries(MODE_LABELS).map(([m,label])=>(
                <div key={m} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.6rem'}}>
                  <span style={{fontSize:'.78rem',color:'#999',width:'52px'}}>{label}</span>
                  <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
                    <button onClick={()=>adjustDur(m,-5)} style={btnRow}>−</button>
                    <span style={{fontSize:'.82rem',fontWeight:'bold',color:'#333',width:'36px',textAlign:'center',fontVariantNumeric:'tabular-nums'}}>{durations[m]}분</span>
                    <button onClick={()=>adjustDur(m,+5)} style={btnRow}>+</button>
                  </div>
                </div>
              ))}
            </div>
          ):(
            /* Timer view */
            <>
              {/* mode tabs */}
              <div style={{display:'flex',gap:'3px',marginBottom:'14px',paddingRight:'48px'}}>
                {Object.entries(MODE_LABELS).map(([k,l])=>(
                  <button key={k} onClick={()=>switchMode(k)} style={{
                    flex:1,border:'none',borderRadius:'6px',padding:'.28rem 0',fontSize:'9px',cursor:'pointer',fontFamily:'inherit',
                    background:mode===k?ac:'#f5f5f5',color:mode===k?'#fff':'#bbb',
                  }}>{l}</button>
                ))}
              </div>

              {/* circular timer */}
              <div style={{display:'flex',justifyContent:'center',marginBottom:'12px'}}>
                <div style={{position:'relative',width:'100px',height:'100px'}}>
                  <svg width="100" height="100" style={{transform:'rotate(-90deg)',position:'absolute',inset:0}}>
                    <circle cx="50" cy="50" r="42" fill="none" stroke="#f0f0f0" strokeWidth="4"/>
                    <circle cx="50" cy="50" r="42" fill="none" stroke={ac} strokeWidth="4"
                      strokeDasharray={`${circum}`} strokeDashoffset={`${circum*(1-progress)}`}
                      strokeLinecap="round" style={{transition:'stroke-dashoffset 0.8s linear'}}/>
                  </svg>
                  <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'2px'}}>
                    <div style={{fontSize:'1.5rem',fontWeight:'bold',color:'#333',fontVariantNumeric:'tabular-nums',letterSpacing:'0.02em'}}>{timeStr}</div>
                    <div style={{fontSize:'.5rem',color:'#ccc',letterSpacing:'.16em'}}>{MODE_LABELS[mode].toUpperCase()}</div>
                  </div>
                </div>
              </div>

              {/* controls */}
              <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:'8px',marginBottom:'10px'}}>
                <button onClick={reset} style={{background:'#f5f5f5',border:'none',borderRadius:'50%',width:'30px',height:'30px',cursor:'pointer',fontSize:'12px',color:'#ccc',display:'flex',alignItems:'center',justifyContent:'center'}}>↺</button>
                <button onClick={()=>setRunning(r=>!r)} style={{background:ac,border:'none',borderRadius:'50%',width:'40px',height:'40px',cursor:'pointer',color:'#fff',fontSize:'13px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 3px 10px ${ac}44`}}>{running?'⏸':'▶'}</button>
              </div>

              {/* session dots */}
              <div style={{display:'flex',justifyContent:'center',gap:'5px'}}>
                {[0,1,2,3].map(i=>(
                  <div key={i} style={{width:'6px',height:'6px',borderRadius:'50%',background:i<session?ac:'#ebebeb',transition:'background .3s'}}/>
                ))}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   MusicWidget
══════════════════════════════════════════════════════════ */
function MusicWidget({color}) {
  const ac = color || '#888';
  const [open,    setOpen]    = React.useState(false);
  const [input,   setInput]   = React.useState('');
  const [urlBar,  setUrlBar]  = React.useState(false);
  const [playing, setPlaying] = React.useState(true);
  const [shuffle, setShuffle] = React.useState(false);
  const [volume,  setVolume]  = React.useState(80);
  const wrapRef   = React.useRef(null);
  const iframeRef = React.useRef(null);

  React.useEffect(()=>{
    if (!open) return;
    function handle(e){ if(!wrapRef.current?.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown',handle);
    document.addEventListener('touchstart',handle,{passive:true});
    return()=>{ document.removeEventListener('mousedown',handle); document.removeEventListener('touchstart',handle); };
  },[open]);

  const [playlist,setPlaylist]= React.useState(()=>{
    try {
      const fix = u => (u&&!u.includes('enablejsapi')) ? u+'&enablejsapi=1' : u;
      const saved=JSON.parse(localStorage.getItem('ytplaylist'));
      if (saved?.length) return saved.map(t=>({...t,embed:fix(t.embed)}));
      const old=localStorage.getItem('ytembed');
      return old?[{embed:fix(old)}]:[];
    } catch { return []; }
  });
  const [current, setCurrent] = React.useState(0);

  /* reset playing flag when track changes (autoplay handles actual playback) */
  React.useEffect(()=>{ setPlaying(true); },[current]);

  const currentEmbed = playlist[current]?.embed || '';

  function ytCmd(func,args=[]) {
    iframeRef.current?.contentWindow?.postMessage(JSON.stringify({event:'command',func,args}),'*');
  }
  function togglePlay() { if(playing){ytCmd('pauseVideo');}else{ytCmd('playVideo');} setPlaying(v=>!v); }
  function nextTrack() {
    if(playlist.length<=1) return;
    if(shuffle){ let n; do{n=Math.floor(Math.random()*playlist.length);}while(n===current&&playlist.length>1); setCurrent(n); }
    else { setCurrent(c=>(c+1)%playlist.length); }
  }
  function prevTrack() { if(playlist.length<=1) return; setCurrent(c=>(c-1+playlist.length)%playlist.length); }
  function handleVolume(v) { setVolume(v); ytCmd('setVolume',[v]); }

  function addTrack() {
    const u=ytEmbed(input);
    if (!u) { alert('유효한 YouTube URL을 넣어줘.'); return; }
    const next=[...playlist,{embed:u}];
    setPlaylist(next); localStorage.setItem('ytplaylist',JSON.stringify(next));
    setCurrent(next.length-1); setUrlBar(false); setInput('');
  }
  function removeTrack(i,e) {
    e.stopPropagation();
    const next=playlist.filter((_,idx)=>idx!==i);
    setPlaylist(next); localStorage.setItem('ytplaylist',JSON.stringify(next));
    setCurrent(c=>c>=next.length?Math.max(0,next.length-1):c);
  }

  const ctrlBtn = {background:'none',border:'none',cursor:'pointer',padding:'2px 5px',fontFamily:'inherit',lineHeight:1};

  return (
    <div ref={wrapRef} style={{position:'fixed',bottom:'20px',left:'20px',zIndex:1000}}>
      {/* pill toggle */}
      <button onClick={()=>setOpen(v=>!v)} style={{
        display:'flex',alignItems:'center',gap:'.35rem',
        background:'#fff',border:'none',borderRadius:'9999px',
        padding:'.38rem .85rem',cursor:'pointer',
        boxShadow:'0 2px 10px rgba(0,0,0,0.10)',fontFamily:'inherit',
      }}>
        <span style={{fontSize:'12px',color:currentEmbed?ac:'#ccc'}}>♪</span>
        <span style={{fontSize:'10px',color:'#bbb',letterSpacing:'.1em'}}>ᴍᴜsɪᴄ</span>
      </button>

      {/* panel — always in DOM; moves off-screen when closed so iframe keeps playing */}
      <div style={{
        position:'absolute',bottom:'42px',
        left:open?'0':'-9999px',
        width:'290px',background:'#fff',borderRadius:'12px',overflow:'hidden',
        boxShadow:open?'0 8px 28px rgba(0,0,0,0.11)':'none',
        border:'1px solid #f0f0f0',
      }}>
        {/* header */}
        {open&&(
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 13px 8px',borderBottom:'1px solid #f7f7f7'}}>
            <span style={{fontSize:'9px',color:'#bbb',letterSpacing:'.14em',fontFamily:'inherit'}}>ᴍᴜsɪᴄ</span>
            <button onClick={()=>setUrlBar(v=>!v)} style={{background:'none',border:'none',color:ac,cursor:'pointer',fontSize:'10px',padding:0,fontFamily:'inherit',fontWeight:'bold'}}>+ 추가</button>
          </div>
        )}

        {/* url input */}
        {open&&urlBar&&(
          <div style={{display:'flex',gap:'6px',padding:'8px 10px'}}>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTrack()}
              placeholder="YouTube URL (영상·플레이리스트 모두 가능)"
              style={{flex:1,background:'#f8f8f8',border:'1px solid #eee',borderRadius:'6px',padding:'.3rem .55rem',color:'#555',fontSize:'10px',fontFamily:'inherit',outline:'none'}}
            />
            <button onClick={addTrack} style={{background:ac,border:'none',borderRadius:'6px',color:'#fff',cursor:'pointer',fontSize:'11px',padding:'0 .55rem'}}>→</button>
          </div>
        )}

        {/* playlist */}
        {open&&playlist.length>0&&(
          <div style={{maxHeight:'110px',overflowY:'auto',padding:'4px 10px 4px'}}>
            {playlist.map((track,i)=>(
              <div key={i} onClick={()=>setCurrent(i)} style={{
                display:'flex',alignItems:'center',gap:'6px',
                padding:'5px 8px',borderRadius:'6px',marginBottom:'2px',
                background:i===current?ac+'18':'transparent',cursor:'pointer',
              }}>
                <span style={{fontSize:'8px',color:i===current?ac:'#ddd'}}>▶</span>
                <span style={{fontSize:'9px',color:i===current?'#444':'#bbb',flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Track {i+1}</span>
                <button onClick={e=>removeTrack(i,e)} style={{background:'none',border:'none',color:'#ccc',cursor:'pointer',fontSize:'9px',padding:'0 2px',lineHeight:1}}>✕</button>
              </div>
            ))}
          </div>
        )}

        {/* controls — prev · play/pause · next · shuffle · volume */}
        {open&&playlist.length>0&&(
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'4px',padding:'6px 10px 7px',borderTop:'1px solid #f5f5f5'}}>
            <button onClick={()=>setShuffle(v=>!v)} title="셔플" style={{...ctrlBtn,fontSize:'12px',color:shuffle?ac:'#ccc'}}>⇌</button>
            <button onClick={prevTrack} title="이전곡" style={{...ctrlBtn,fontSize:'12px',color:'#bbb'}}>⏮</button>
            <button onClick={togglePlay} title={playing?'일시정지':'재생'} style={{
              width:'26px',height:'26px',borderRadius:'50%',flexShrink:0,
              background:ac,border:'none',color:'#fff',cursor:'pointer',fontSize:'10px',
              display:'flex',alignItems:'center',justifyContent:'center',
            }}>{playing?'⏸':'▶'}</button>
            <button onClick={nextTrack} title="다음곡" style={{...ctrlBtn,fontSize:'12px',color:'#bbb'}}>⏭</button>
            <input type="range" min="0" max="100" value={volume}
              onChange={e=>handleVolume(Number(e.target.value))}
              title={`음량 ${volume}%`}
              style={{width:'50px',accentColor:ac,cursor:'pointer',marginLeft:'2px'}}
            />
          </div>
        )}

        {/* empty state */}
        {open&&playlist.length===0&&(
          <div style={{padding:'20px 12px 24px',display:'flex',flexDirection:'column',alignItems:'center',gap:'7px'}}>
            <span style={{fontSize:'20px',opacity:.15}}>♪</span>
            <span style={{fontSize:'10px',color:'#ccc',textAlign:'center',lineHeight:1.6}}>YouTube URL을 추가해봐.<br/>음악도, 플레이리스트도 돼.</span>
            <button onClick={()=>setUrlBar(true)} style={{marginTop:'4px',background:'#f5f5f5',border:'none',borderRadius:'6px',color:'#aaa',cursor:'pointer',fontSize:'10px',padding:'.3rem .75rem',fontFamily:'inherit'}}>+ 추가</button>
          </div>
        )}

        {/* iframe — always rendered for background playback */}
        {currentEmbed?(
          <div style={{lineHeight:0}}>
            <iframe ref={iframeRef} src={currentEmbed} width="290" height="163" frameBorder="0"
              allow="autoplay; encrypted-media; picture-in-picture" allowFullScreen
              style={{display:'block'}}/>
          </div>
        ):null}
      </div>
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   StickyWidget  (floating memo pad — text + image)
══════════════════════════════════════════════════════════ */
function StickyWidget({color, open, onOpen, onClose}) {
  const ac = color || '#888';
  const [notes,  setNotes] = React.useState(()=>{ try{return JSON.parse(localStorage.getItem('stickies'))||[];}catch{return [];} });
  const [input,  setInput] = React.useState('');
  const [pendImg,setPendImg]= React.useState(null);
  const fileRef  = React.useRef(null);

  /* clipboard image paste */
  React.useEffect(()=>{
    if (!open) return;
    function hp(e){
      const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
      if (!item) return;
      const r=new FileReader(); r.onload=ev=>setPendImg(ev.target.result); r.readAsDataURL(item.getAsFile());
    }
    document.addEventListener('paste',hp);
    return()=>document.removeEventListener('paste',hp);
  },[open]);

  function persist(next){ setNotes(next); localStorage.setItem('stickies',JSON.stringify(next)); }
  function addNote(){
    if (!input.trim()&&!pendImg) return;
    persist([{id:Date.now(),text:input.trim(),img:pendImg},...notes]);
    setInput(''); setPendImg(null);
  }
  function delNote(id){ persist(notes.filter(n=>n.id!==id)); }
  function handleFile(e){
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=ev=>setPendImg(ev.target.result); r.readAsDataURL(f);
    e.target.value='';
  }

  /* theme-tinted palette */
  const panelBg  = ac + '0e'; // 거의 흰색에 테마색 살짝
  const border   = ac + '30';
  const inputBg  = ac + '08';
  const inputBdr = ac + '28';
  const noteBdr  = ac + '22';
  const labelClr = ac + 'aa';
  const addBg    = ac + '22';

  return (
    <div style={{position:'fixed',top:'1rem',right:'1rem',zIndex:900}}>
      {/* toggle pill */}
      <button onClick={()=>open?onClose():onOpen()} style={{
        display:'flex',alignItems:'center',gap:'.3rem',
        background:open ? ac+'22' : '#fff',
        border:`1px solid ${open ? ac+'44' : 'transparent'}`,
        borderRadius:'9999px',
        padding:'.38rem .85rem',cursor:'pointer',
        boxShadow:'0 2px 10px rgba(0,0,0,0.09)',fontFamily:'inherit',
        transition:'background .15s',
      }}>
        <span style={{fontSize:'11px',color:open ? ac : '#bbb'}}>✎</span>
        <span style={{fontSize:'10px',color:open ? ac+'cc' : '#bbb',letterSpacing:'.1em'}}>ᴍᴇᴍᴏ</span>
      </button>

      {/* panel — opens downward */}
      {open&&(
        <div style={{
          position:'absolute',top:'calc(100% + 6px)',right:0,
          width:'264px',maxHeight:'440px',
          background:'#fff',borderRadius:'12px',
          boxShadow:'0 8px 28px rgba(0,0,0,0.11)',
          border:`1px solid ${border}`,
          display:'flex',flexDirection:'column',overflow:'hidden',
        }}>
          {/* header */}
          <div style={{padding:'9px 13px 7px',borderBottom:`1px solid ${border}`,flexShrink:0,background:panelBg}}>
            <span style={{fontSize:'9px',color:labelClr,letterSpacing:'.14em'}}>ᴍᴇᴍᴏ</span>
          </div>

          {/* input area */}
          <div style={{padding:'8px 11px 6px',flexShrink:0,borderBottom:`1px solid ${border}`,background:panelBg}}>
            <textarea value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addNote();}}}
              placeholder="메모 입력. 이미지는 Ctrl+V 또는 📎 버튼." rows={3}
              style={{width:'100%',background:inputBg,border:`1px solid ${inputBdr}`,borderRadius:'6px',
                padding:'.38rem .5rem',fontFamily:'inherit',fontSize:'10px',lineHeight:1.65,
                resize:'none',outline:'none',color:'#444',display:'block'}}
            />
            {/* pending image preview */}
            {pendImg&&(
              <div style={{position:'relative',display:'inline-block',marginTop:'5px'}}>
                <img src={pendImg} alt="" style={{maxWidth:'100%',maxHeight:'72px',borderRadius:'5px',border:`1px solid ${inputBdr}`,display:'block'}}/>
                <button onClick={()=>setPendImg(null)} style={{
                  position:'absolute',top:'-5px',right:'-5px',
                  background:'#ff7272',border:'none',borderRadius:'50%',
                  width:'14px',height:'14px',color:'#fff',cursor:'pointer',fontSize:'8px',padding:0,
                  display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1,
                }}>✕</button>
              </div>
            )}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'5px'}}>
              <button onClick={()=>fileRef.current?.click()} style={{background:'none',border:'none',cursor:'pointer',fontSize:'10px',color:labelClr,padding:'1px 3px',fontFamily:'inherit'}}>📎 이미지</button>
              <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:'none'}}/>
              <button onClick={addNote} style={{background:addBg,border:`1px solid ${border}`,borderRadius:'6px',cursor:'pointer',fontSize:'10px',padding:'.22rem .65rem',fontFamily:'inherit',color:ac,fontWeight:'bold'}}>추가 →</button>
            </div>
          </div>

          {/* notes list */}
          <div style={{overflowY:'auto',padding:'6px 10px 10px',flex:1}}>
            {notes.length===0&&(
              <div style={{textAlign:'center',color:'#ccc',fontSize:'10px',padding:'18px 0'}}>아직 메모가 없어.</div>
            )}
            {notes.map(note=>(
              <div key={note.id} style={{
                background:'#fff',border:`1px solid ${noteBdr}`,borderRadius:'8px',
                padding:'8px 28px 8px 10px',marginBottom:'6px',position:'relative',
              }}>
                {note.img&&<img src={note.img} alt="" style={{width:'100%',borderRadius:'5px',marginBottom:'5px',display:'block'}}/>}
                {note.text&&<div style={{fontSize:'10px',color:'#333',lineHeight:1.75,whiteSpace:'pre-wrap'}}>{note.text}</div>}
                <button onClick={()=>delNote(note.id)} style={{
                  position:'absolute',top:'6px',right:'7px',background:'none',border:'none',
                  color:'#ccc',cursor:'pointer',fontSize:'10px',padding:0,lineHeight:1,
                }}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════
   DemianWidget
══════════════════════════════════════════════════════════ */
function DemianWidget() {
  const [vis,    setVis]    = React.useState(false);
  const [msg,    setMsg]    = React.useState('');
  const [online, setOnline] = React.useState(false);
  const [cfg,    setCfg]    = React.useState(false);
  const [sched,  setSched]  = React.useState(loadSched);
  const [edit,   setEdit]   = React.useState(loadSched);

  const isFocus=React.useCallback(()=>{ const n=new Date(),r=sched[n.getDay()]; return r&&n.getHours()>=r.s&&n.getHours()<r.e; },[sched]);

  React.useEffect(()=>{
    const run=async()=>{
      const on=isFocus(); setOnline(on);
      if (on) {
        try {
          const res=await fetch("https://raw.githubusercontent.com/nagi-00/nagi-todo/main/demian_focus_messages.json");
          const d=await res.json();
          setMsg(d.messages[Math.floor(Math.random()*d.messages.length)]);
        } catch { setMsg("메시지를 불러오지 못했어."); }
      }
    };
    run(); const t=setInterval(run,60000); return()=>clearInterval(t);
  },[isFocus]);

  function save() { setSched(edit); localStorage.setItem('focusSched',JSON.stringify(edit)); setCfg(false); }
  function upd(d,f,v) { const n=parseInt(v,10); if(isNaN(n)||n<0||n>23) return; setEdit(p=>({...p,[d]:{...(p[d]||{s:0,e:0}),[f]:n}})); }
  function tog(d) { setEdit(p=>{ const n={...p}; n[d]?delete n[d]:n[d]=DEF_SCHED[d]||{s:6,e:18}; return n; }); }

  const numInp={width:'2.9rem',padding:'.2rem',border:'1px solid #eee',borderRadius:'4px',textAlign:'center',fontSize:'10px',fontFamily:'inherit',outline:'none'};

  return (
    <>
      <div onClick={()=>{setVis(v=>!v);if(vis)setCfg(false);}} style={{
        position:'fixed',bottom:'20px',right:'20px',
        width:'50px',height:'50px',borderRadius:'50%',
        background:online?'#b8b8b8':'#d8d8d8',
        display:'flex',alignItems:'center',justifyContent:'center',
        cursor:'pointer',zIndex:1000,
        boxShadow:'0 4px 16px rgba(0,0,0,0.14)',
        transition:'background .3s',
      }}>
        <span style={{fontSize:'19px'}}>🖤</span>
      </div>

      {vis&&(
        <div style={{
          position:'fixed',bottom:'80px',right:'20px',width:'265px',
          background:'#fff',borderRadius:'12px',padding:'15px 17px',
          boxShadow:'0 8px 28px rgba(0,0,0,0.11)',zIndex:999,
        }}>
          <button onClick={e=>{e.stopPropagation();cfg?setCfg(false):(setEdit({...sched}),setCfg(true));}} style={{
            position:'absolute',top:'10px',right:'13px',
            background:'none',border:'none',cursor:'pointer',fontSize:'.65rem',color:'#ccc',padding:0,fontFamily:'inherit'
          }}>⚙ 설정</button>

          {cfg?(
            <div>
              <div style={{fontWeight:'bold',fontSize:'12px',marginBottom:'.7rem'}}>위젯 설정</div>
              <div style={{fontSize:'10px',color:'#ccc',marginBottom:'.5rem'}}>요일별 집중 시간 (24시)</div>
              {[1,2,3,4,5,6,0].map(d=>(
                <div key={d} style={{display:'flex',alignItems:'center',gap:'.3rem',marginBottom:'.38rem'}}>
                  <button onClick={()=>tog(d)} style={{
                    width:'1.4rem',height:'.85rem',borderRadius:'9999px',border:'none',cursor:'pointer',padding:0,flexShrink:0,
                    background:edit[d]?'#444':'#e8e8e8',position:'relative',transition:'background .2s',
                  }}>
                    <span style={{position:'absolute',top:'1px',left:edit[d]?'6px':'1px',width:'calc(.85rem - 4px)',height:'calc(.85rem - 4px)',borderRadius:'50%',background:'#fff',transition:'left .2s'}}/>
                  </button>
                  <span style={{width:'1.2rem',fontSize:'11px',fontWeight:'600',color:edit[d]?'#333':'#ccc'}}>{DAY_KO[d]}</span>
                  {edit[d]?(
                    <>
                      <input type="number" min="0" max="23" value={edit[d].s} onChange={e=>upd(d,'s',e.target.value)} style={numInp}/>
                      <span style={{color:'#ddd',fontSize:'9px'}}>–</span>
                      <input type="number" min="0" max="23" value={edit[d].e} onChange={e=>upd(d,'e',e.target.value)} style={numInp}/>
                      <span style={{color:'#ccc',fontSize:'9px'}}>시</span>
                    </>
                  ):(
                    <span style={{fontSize:'9px',color:'#ccc'}}>휴일</span>
                  )}
                </div>
              ))}
              <div style={{display:'flex',gap:'.4rem',marginTop:'.65rem'}}>
                <button onClick={()=>setCfg(false)} style={{...pill('#f5f5f5','#aaa',true),flex:1,borderRadius:'.375rem',padding:'.35rem'}}>취소</button>
                <button onClick={save} style={{...pill('#222','#fff',true),flex:1,borderRadius:'.375rem',padding:'.35rem'}}>저장</button>
              </div>
            </div>
          ):online?(
            <>
              <div style={{fontWeight:'bold',fontSize:'12px',marginBottom:'.35rem',letterSpacing:'.05em'}}>ᴅᴇᴍɪᴀɴ</div>
              <div style={{fontSize:'12px',color:'#555',lineHeight:1.7}}>{msg}</div>
            </>
          ):(
            <>
              <div style={{textAlign:'center',color:'#aaa',fontSize:'12px',marginBottom:'.45rem'}}>😴 휴식의 시간이야.</div>
              <div style={{fontSize:'10px',textAlign:'center',color:'#ccc',lineHeight:1.95}}>
                <div style={{fontWeight:'bold',marginBottom:'.1rem',letterSpacing:'.04em',color:'#bbb'}}>𝗙𝗼𝗰𝘂𝘀 𝗧𝗶𝗺𝗲</div>
                {Object.entries(sched).map(([d,r])=>(
                  <div key={d}>{DAY_KO[d]}&nbsp;&nbsp;{String(r.s).padStart(2,'0')}:00 – {String(r.e).padStart(2,'0')}:00</div>
                ))}
              </div>
            </>
          )}
        </div>
      )}
    </>
  );
}


/* ══════════════════════════════════════════════════════════
   TimeBlockPanel  (right-side slide panel)
══════════════════════════════════════════════════════════ */
function TimeBlockPanel({dk, color, open, onClose}) {
  const [blocks,     setBlocks]     = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('timeBlocks')) || {}; }
    catch { return {}; }
  });
  const [paintMode,  setPaintMode]  = React.useState(false);
  const [paintLevel, setPaintLevel] = React.useState(2);
  const [hov,        setHov]        = React.useState(null); // "h,slot" string key
  const isPaintingRef = React.useRef(false);

  React.useEffect(() => {
    function up() { isPaintingRef.current = false; }
    window.addEventListener('mouseup', up);
    return () => window.removeEventListener('mouseup', up);
  }, []);

  const dayBlocks = blocks[dk] || {};

  function slotColor(level) {
    if (level === 0) return '#ebebeb';
    if (level === 1) return color + '50';
    if (level === 2) return color + '99';
    return color;
  }

  function toggleSlot(h, slot) {
    const cur = (dayBlocks[h] || [0,0,0,0,0,0])[slot];
    const newSlots = [...(dayBlocks[h] || [0,0,0,0,0,0])];
    newSlots[slot] = (cur + 1) % 4;
    const next = {...blocks, [dk]: {...dayBlocks, [h]: newSlots}};
    setBlocks(next);
    localStorage.setItem('timeBlocks', JSON.stringify(next));
  }

  function applyPaint(h, slot) {
    setBlocks(prev => {
      const prevDay   = prev[dk] || {};
      const prevSlots = prevDay[h] || [0,0,0,0,0,0];
      if (prevSlots[slot] === paintLevel) return prev;
      const newSlots = [...prevSlots];
      newSlots[slot]  = paintLevel;
      const next = {...prev, [dk]: {...prevDay, [h]: newSlots}};
      localStorage.setItem('timeBlocks', JSON.stringify(next));
      return next;
    });
  }

  function handleSlotDown(e, h, slot) {
    e.preventDefault();
    if (paintMode) { isPaintingRef.current = true; applyPaint(h, slot); }
    else           { toggleSlot(h, slot); }
  }

  function handleSlotEnter(h, slot) {
    setHov(`${h},${slot}`);
    if (paintMode && isPaintingRef.current) applyPaint(h, slot);
  }

  const HOURS = Array.from({length: 18}, (_, i) => i + 6);
  const now = new Date();
  const nowH = now.getHours(), nowM = now.getMinutes();

  const totalDeepMin  = Object.values(dayBlocks).reduce((s,sl)=>s+(sl||[]).filter(v=>v===3).length*10,0);
  const totalFocusMin = Object.values(dayBlocks).reduce((s,sl)=>s+(sl||[]).filter(v=>v>0).length*10,0);

  async function exportImg() {
    const el = document.getElementById('tbcard'); if (!el) return;
    const cv = await html2canvas(el, {backgroundColor:'#fff', scale:2, useCORS:true});
    cv.toBlob(async blob => {
      if (!blob) return;
      try { await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); alert('클립보드에 복사했어.'); }
      catch { const u=URL.createObjectURL(blob),a=document.createElement('a'); a.href=u;a.download=`timeblock-${dk}.png`;a.click();URL.revokeObjectURL(u); }
    });
  }

  const grid = (interactive) => (
    <div style={{display:'flex',flexDirection:'column',gap:'3px',userSelect:'none'}}>
      {HOURS.map(h => {
        const slots = dayBlocks[h] || [0,0,0,0,0,0];
        const isCurHour = interactive && h === nowH;
        return (
          <div key={h} style={{display:'flex',alignItems:'center',gap:'7px'}}>
            <span style={{
              fontSize:'.58rem', width:'1.4rem', textAlign:'right', flexShrink:0,
              color: isCurHour ? color : '#ccc',
              fontWeight: isCurHour ? 'bold' : 'normal',
            }}>{h}</span>
            <div style={{display:'flex',gap:'2px'}}>
              {slots.map((level, slot) => {
                const isCurSlot = isCurHour && slot === Math.floor(nowM / 10);
                const isHov     = interactive && hov === `${h},${slot}`;
                // paint-mode hover: preview the paint color; normal hover: subtle ring
                const bg = (isHov && paintMode) ? slotColor(paintLevel) : slotColor(level);
                const shadow = isCurSlot
                  ? `inset 0 0 0 2px ${color}`
                  : (isHov && !paintMode)
                    ? 'inset 0 0 0 1.5px rgba(0,0,0,0.22)'
                    : 'none';
                return (
                  <div key={slot}
                    onMouseDown={interactive ? e => handleSlotDown(e, h, slot) : undefined}
                    onMouseEnter={interactive ? () => handleSlotEnter(h, slot) : undefined}
                    onMouseLeave={interactive ? () => setHov(null) : undefined}
                    style={{
                      width:'14px', height:'14px',
                      background: bg,
                      borderRadius:'2px',
                      cursor: interactive ? (paintMode ? 'crosshair' : 'pointer') : 'default',
                      boxShadow: shadow,
                      transition: 'background .12s, box-shadow .08s',
                    }}
                  />
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );

  const legend = (
    <div style={{display:'flex',flexDirection:'column',gap:'.35rem'}}>
      {[1,2,3].map(l=>(
        <div key={l} style={{display:'flex',alignItems:'center',gap:'5px'}}>
          <div style={{width:'9px',height:'9px',borderRadius:'1px',background:slotColor(l)}}/>
          <span style={{fontSize:'.55rem',color:'#bbb'}}>{['낮음','보통','딥포커스'][l-1]}</span>
        </div>
      ))}
    </div>
  );

  /* paint-mode level picker (level 0 = 없음/erase) */
  const LEVEL_LABELS = ['없음','낮음','보통','딥포커스'];
  const levelPicker = (
    <div style={{display:'flex',gap:'4px',alignItems:'center'}}>
      <span style={{fontSize:'.52rem',color:'#ccc',marginRight:'1px'}}>컬러</span>
      {[0,1,2,3].map(l=>(
        <div key={l} title={LEVEL_LABELS[l]} onClick={()=>setPaintLevel(l)} style={{
          width:'15px', height:'15px', background:slotColor(l), borderRadius:'2px',
          cursor:'pointer',
          boxShadow: l===0 ? 'inset 0 0 0 1px #ccc' : 'none',
          outline: paintLevel===l ? `2px solid ${color}` : '2px solid transparent',
          outlineOffset:'1.5px', transition:'outline .1s',
        }}/>
      ))}
    </div>
  );

  /* CSS paint-brush icon: 3 horizontal bars fading opacity */
  const paintIcon = (
    <div style={{display:'flex',flexDirection:'column',gap:'2px',width:'12px'}}>
      {[1,.6,.3].map((op,i)=>(
        <div key={i} style={{height:'3px',background:paintMode?color:'#ccc',borderRadius:'1px',opacity:op,transition:'background .15s'}}/>
      ))}
    </div>
  );

  return (
    <>
      {/* ── slide panel ── */}
      <aside style={{
        position:'fixed', right:0, top:0, bottom:0, width:'13rem',
        background:'#fff', overflow:'auto',
        zIndex: open ? 1001 : 20,
        boxShadow:'-2px 0 10px rgba(0,0,0,0.06)',
        transform: open ? 'translateX(0)' : 'translateX(100%)',
        transition:'transform .25s ease',
      }}>
        <div style={{padding:'1.25rem 1rem 2rem'}}>

          {/* header */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.9rem',paddingTop:'.6rem'}}>
            <span style={sectionLabel({marginBottom:0})}>ᴛɪᴍᴇ ʙʟᴏᴄᴋ</span>
            <div style={{display:'flex',gap:'.35rem',alignItems:'center'}}>
              {totalFocusMin > 0 && (
                <button onClick={exportImg} style={{...pill(color,'#fff',true),padding:'.2rem .55rem'}}>↗</button>
              )}
              <button onClick={onClose} className="icon-btn" style={{fontSize:'1rem'}}>✕</button>
            </div>
          </div>

          {totalDeepMin > 0 && (
            <div style={{fontSize:'.62rem',color,fontWeight:'bold',marginBottom:'.8rem'}}>
              {Math.floor(totalDeepMin/60)>0?`${Math.floor(totalDeepMin/60)}h `:''}
              {totalDeepMin%60>0?`${totalDeepMin%60}m `:''}딥포커스
            </div>
          )}

          {grid(true)}

          <div style={{marginTop:'.9rem',borderTop:'1px solid #f5f5f5',paddingTop:'.75rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              {paintMode ? levelPicker : legend}
              <button onClick={()=>setPaintMode(v=>!v)} style={{
                background:'none',border:'none',cursor:'pointer',padding:'3px',
                display:'flex',alignItems:'center',
                background: paintMode ? color+'15' : 'none',
                borderRadius:'4px', transition:'background .15s',
              }}>
                {paintIcon}
              </button>
            </div>
            {!paintMode && totalFocusMin > 0 && (
              <div style={{fontSize:'.58rem',color:'#ccc',marginTop:'.5rem'}}>총 {totalFocusMin}m 기록</div>
            )}
          </div>
        </div>
      </aside>

      {/* ── off-screen export card ── */}
      <div id="tbcard" style={{
        position:'fixed', left:'-9999px', top:0,
        fontFamily:'HJSS,sans-serif', background:'#fff',
        width:'200px', padding:'1.25rem 1rem 1rem',
      }}>
        <div style={{fontSize:'.5rem',letterSpacing:'.2em',color,marginBottom:'.2rem'}}>ᴛɪᴍᴇ ʙʟᴏᴄᴋ</div>
        <div style={{fontSize:'.58rem',color:'#bbb',marginBottom:'.75rem'}}>{dk}</div>
        {grid(false)}
        <div style={{marginTop:'.75rem',borderTop:`1.5px solid ${color}33`,paddingTop:'.6rem',display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          {legend}
          {totalDeepMin > 0 && (
            <div style={{fontSize:'.6rem',color,fontWeight:'bold',textAlign:'right'}}>
              {Math.floor(totalDeepMin/60)>0?`${Math.floor(totalDeepMin/60)}h `:''}
              {totalDeepMin%60>0?`${totalDeepMin%60}m`:''}
              <div style={{fontSize:'.5rem',fontWeight:'normal',color:'#bbb'}}>딥포커스</div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
